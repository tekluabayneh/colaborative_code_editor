version: "3"

env:
  BORDER: double
  BORDER_FOREGROUND: "212"
  PADDING: "1 1"
  MARGIN: "1 1"

tasks:
  kind:01-generate-config:
    desc: "Generate kind config with local absolute paths for PV mounts"
    cmds:
      - REPLACE_WITH_ABSOLUTE_PATH=${PWD} envsubst < kind-config.yaml.TEMPLATE >
        kind-config.yaml

  kind:02-generate-local-config:
    desc: "Generate kind config with local absolute paths for PV mounts"
    cmds:
      - REPLACE_WITH_ABSOLUTE_PATH=${PWD} envsubst <
        kind-config-local.yaml.TEMPLATE > kind-config-local.yaml

  kind:03-create-local-cluster:
    desc: "Create local Kubernetes cluster using kind"
    cmds:
      - kind create cluster --config kind-config-local.yaml

  kind:04-create-cluster:
    desc: "Create a Kubernetes cluster using kind"
    cmds:
      - kind create cluster --config kind-config.yaml

  kind:05-run-cloud-provider-kind:
    desc: "Run sigs.k8s.io/cloud-provider-kind@latest to enable load balancer
      services with KinD"
    cmds:
      - kitty --title "KinD Cloud Provider" bash -c "sudo \$(which
        cloud-provider-kind); exec bash"

  kind:06-local-ingress-controller:
    desc: "Install NGINX Ingress Controller for Local Testing"
    cmds:
      - kubectl apply -f
        https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
      - echo "Waiting for local Ingress controller to be ready (up to 5
        minutes)..."
      - kubectl wait --namespace ingress-nginx --for=condition=ready pod
        --selector=app.kubernetes.io/component=controller --timeout=300s

  kind:07-install-ingress-controller:
    desc: "Install NGINX Ingress Controller for Cloud"
    cmds:
      - kubectl apply -f
        https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.2/deploy/static/provider/cloud/deploy.yaml
      - echo "Waiting for Ingress controller to be ready (up to 5 minutes)..."
      - kubectl wait --namespace ingress-nginx --for=condition=ready pod
        --selector=app.kubernetes.io/component=controller --timeout=300s

  kind:08-delete-cluster:
    desc: "Delete an existing kind Kubernetes cluster"
    cmds:
      - kind delete cluster

  kind:setup-all:
    desc: "Run full local setup: generate config → create cluster → enable LB →
      install ingress"
    deps:
      - kind:01-generate-config
      - kind:04-create-cluster
      - kind:05-run-cloud-provider-kind
      - kind:07-install-ingress-controller
    cmds:
      - echo "Kind cluster is now ready with Ingress controller!"

  kind:setup-namespace:
    desc: "create namespace for both frontend and backend as certall namespace"
    cmds:
      - kubectl create namespace colab-app
      - echo "colab-app namespace created successfully"

  kind:apply-sandbox:
    desc: "Apply the sandbox overlay (your actual app)"
    cmds:
      - kustomize build overlays/sandbox | kubectl apply -f -

  kind:show-external-ip:
    desc: "Show the public IP or hostname of the Ingress controller"
    cmds:
      - echo "Your public URL (wait if EXTERNAL-IP is still <pending>):"
      - kubectl get svc ingress-nginx-controller -n ingress-nginx

  kind:up:
    desc: "Full setup: cluster + LB + ingress + apply app"
    deps: [kind:setup-all, kind:apply-sandbox]
    cmds:
      - task: kind:show-external-ip

  kind:down:
    desc: "Clean up: delete the cluster"
    cmds:
      - task: kind:08-delete-cluster
